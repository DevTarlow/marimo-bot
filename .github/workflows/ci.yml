# What has to be true before this can be released.
#
# The two checks at the end are the ones worth the runner minutes. A unit test
# cannot see a preload bridge that stopped matching the contract, a renderer that
# no longer mounts, a second window that does not open, or a job runner that
# cannot start from a packaged build — and every one of those has been a real bug
# in this repository rather than a hypothetical.
name: CI

# On every push to main, and on every pull request.
#
# It was pull requests and the Actions tab only, because this repository was
# private and every run spent metered minutes — a few pushes an hour was a bill
# for a verdict nobody reads. Standard runners are free on a public repository, so
# that reason is gone, and what it was buying is worth having back: this is pushed
# straight to main, so there is rarely a pull request to trigger it, and the smoke
# check would otherwise wait for somebody to remember the Actions tab.
#
# The rest of what made it cheap is still here, because it was never only about
# money: `concurrency` cancels a superseded run rather than finishing a verdict on
# code that has already changed, the job has a twenty-minute timeout so a hung
# step cannot sit on a runner, and a prose-only change is skipped.
on:
  push:
    branches: [main]
    # One list, anchored rather than copied, so a second trigger cannot drift out
    # of step with the first. A change to prose is not a change to the app.
    paths-ignore: &prose-only
      - '**.md'
      - 'LICENCE'
      - 'LICENSE'
      - 'NOTICE'
      - '.gitignore'
  pull_request:
    paths-ignore: *prose-only
  workflow_dispatch:
    inputs:
      package:
        description: Build the AppImage and prove the packaged runner starts
        type: boolean
        default: false

# One run per branch, and a newer push cancels the older run. Without this, five
# pushes in ten minutes is five full suites, four of them answering a question
# about code that no longer exists.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A step that hangs would otherwise bill for the six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The version is deliberately *not* given here. `package.json` already
      # pins it with `packageManager`, and pnpm/action-setup refuses to run when
      # both say a version — `version: 11` beside `pnpm@11.7.0` fails the job at
      # its first step with ERR_PNPM_BAD_PM_VERSION. One source of truth, and it
      # is the one a developer's `pnpm install` already obeys.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.4"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

      # Boots a real window over the DevTools protocol and asserts the bridge
      # answers, React mounted, the conversation round-trips, the companion
      # window is up and transparent, and a fresh install can reach the provider
      # card rather than showing a chat that cannot answer.
      - name: Smoke
        run: xvfb-run --auto-servernum pnpm --filter @marimo/desktop smoke
        env:
          MARIMO_NO_SANDBOX: '1'

      # Why it is worth running at all: packaging is the one thing that works in
      # development and can be broken by packaging alone, because
      # `ELECTRON_RUN_AS_NODE=1` has no asar support and an archive the runner
      # cannot read leaves the background service silently unable to start. The
      # runner is expected to report the recall model as not installed, which is a
      # state it has to handle anyway.
      # The expensive half, and the one that proves a single thing: that the
      # packaged app's runner starts. It downloads an Electron release and builds
      # an AppImage, so it is not worth paying for on every change — run it from
      # the Actions tab ("Run workflow", tick package) before a release, or when
      # `package.json`, the build config or the runner's paths have moved.
      - name: Package, and prove the runner still starts
        if: ${{ inputs.package }}
        run: |
          pnpm --filter @marimo/desktop package
          APP="apps/desktop/release/linux-unpacked"
          ELECTRON_RUN_AS_NODE=1 "$APP/marimo-agent" \
            "$PWD/$APP/resources/app/dist/runner/run-due.js" --json
        env:
          MARIMO_USER_DATA_DIR: ${{ runner.temp }}/marimo-ci
